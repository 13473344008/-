<!doctype html><html lang="zh-CN" data-palette="champagne"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><title>星尘</title><link rel="stylesheet" href="style.css?v=orbit"></head><body>
<canvas id="universe" aria-label="立体粒子星辰，左右拖动旋转"></canvas><div class="vignette"></div>
<header><a class="brand" href="./">✳ <span>星尘</span></a><div class="actions"><button id="cameraButton" class="camera-button">开启手势</button><details id="settings"><summary aria-label="设置">···</summary><div class="settings-panel"><label>配色<select id="palette" aria-label="配色"><option value="champagne">香槟金</option><option value="purple">紫色</option></select></label><label class="check"><input id="shapeGestureToggle" type="checkbox" checked>手势切换形态</label><button id="resetButton">重置视角</button><p>左右转动手掌控制横向旋转，倾角和大小固定。轻微手抖会被过滤。重新入镜先稳住画面，再从当前姿态继续。</p><p>鼠标左右拖动旋转。数字 1–4 换形，R 重置。</p><p>做出手势即可换形：握拳＝星核、V手势＝星环、张掌＝星团、竖拇指＝超新星。</p><small>画面仅在本机处理，不上传、不录制。</small></div></details></div></header>
<div id="status" role="status" aria-live="polite"></div>
<div id="cameraWindow" class="camera-window" hidden><video id="camera" muted playsinline></video><canvas id="skeleton"></canvas></div>
<footer aria-label="手势说明"><span>握拳 <b>星核</b></span><span>食指中指比V <b>星环</b></span><span>五指张开 <b>星团</b></span><span>竖拇指 <b>超新星</b></span></footer>
<div id="fatal" hidden role="alert"></div><script type="module" src="app.js?v=v-gesture"></script></body></html>
