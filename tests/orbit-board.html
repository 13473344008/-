<!doctype html><meta charset="utf-8"><title>四形态粒子运动检查</title><style>body{background:#09080d;color:#e8d4b9;font:12px system-ui;margin:20px}button{padding:10px}#frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}canvas{width:100%}figure{margin:0}pre{white-space:pre-wrap}</style><button id="run">检查粒子运动</button><pre id="report">对照0秒、2秒、4秒；高亮区域像素差用于排除背景流光。</pre><section id="frames"></section><script type="module">
import {ParticleEngine} from '/engine.js?v=orbit';import {VIEW_SCALE} from '/geometry.mjs?v=orbit';
const source=document.createElement('canvas'),e=new ParticleEngine(source);source.width=960;source.height=600;e.w=960;e.h=600;e.dpr=1;const names=['星核','星环','星团','超新星'];
const run=document.getElementById('run'),frames=document.getElementById('frames'),report=document.getElementById('report');
run.onclick=()=>{try{frames.replaceChildren();const results=[];for(let k=0;k<4;k++){let first;const deltas=[],peaks=[];for(const t of [0,2,4]){e.weights.fill(0);e.weights[k]=1;e.fromWeights.set(e.weights);e.morphTarget=k;e.morphTime=1;e.render(t,k,.25,.2,VIEW_SCALE,0);const g=e.gl,p=new Uint8Array(960*600*4);g.readPixels(0,0,960,600,g.RGBA,g.UNSIGNED_BYTE,p);if(g.getError())throw Error('WebGL error');let changed=0;const bright=[];for(let i=0;i<p.length;i+=4){if(p[i]>110)bright.push(p[i]);if(first&&Math.max(p[i],first[i])>110&&Math.abs(p[i]-first[i])>12)changed++;}bright.sort((a,b)=>a-b);peaks.push(bright[Math.floor(bright.length*.95)]);if(first)deltas.push(changed);else first=p;const f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=320;c.height=200;c.getContext('2d').drawImage(source,0,0,320,200);label.textContent=names[k]+' · '+t+'秒';f.append(c,label);frames.append(f);}results.push({shape:names[k],changedBrightPixels:deltas,peakValues:peaks});}report.textContent=JSON.stringify({pass:results.every(r=>r.changedBrightPixels.every(n=>n>500)),results,webglErrors:0},null,2);}catch(e){report.textContent=e.message;}};
</script>
