<!doctype html><meta charset="utf-8"><title>四状态过渡检查</title><style>*{box-sizing:border-box}body{margin:0;background:#080610;color:#cfb6f0;font:11px system-ui}header{height:52px;display:flex;align-items:center;gap:12px;padding:8px 18px}button{background:#352446;border:1px solid #705684;color:#eadbff;padding:7px 12px;cursor:pointer}#grid{display:grid;grid-template-columns:repeat(4,1fr);height:calc(100vh - 52px);gap:2px}figure{margin:0;position:relative;overflow:hidden;background:#080610}canvas{width:100%;height:100%;object-fit:contain}figcaption{position:absolute;top:4px;left:8px;font-size:10px}#result{margin-left:auto;font-size:10px}</style><header><b>12 个方向 · 全状态过渡</b><button data-t="0">起点</button><button data-t=".25">25%</button><button data-t=".5">50%</button><button data-t=".75">75%</button><button data-t="1">终点</button><button id="angle">视角：默认</button><button id="palette">配色：金</button><button id="scan">亮度连续性检测</button><button id="play">循环播放</button><span id="result">准备…</span></header><div id="grid"></div><script type="module">
import {ParticleEngine} from '/engine.js?v=orbit';
import {VIEW_SCALE} from '/geometry.mjs?v=orbit';
const names=['星核','星环','星团','超新星'];const source=document.createElement('canvas');const e=new ParticleEngine(source);source.width=960;source.height=600;e.w=1200;e.h=750;e.dpr=1;e.gl.viewport(0,0,960,600);const entries=[];
for(let a=0;a<4;a++)for(let b=0;b<4;b++){const f=document.createElement('figure'),c=document.createElement('canvas');c.width=320;c.height=200;f.append(c);const label=document.createElement('figcaption');label.textContent=names[a]+' → '+names[b];f.append(label);grid.append(f);entries.push({a,b,c});}
const pixels=new Uint8Array(960*600*4),background=new Uint8Array(960*600*4);let playing=false,start=0,last=0,view=0,current=.5;const views=[[.25,.2],[.25,.69],[.25,-.85],[.25,1.7]];
function draw(t){current=t;
const count=e.count;e.count=0;e.weights.fill(0);e.fromWeights.fill(0);e.morphTarget=-1;e.morphTime=1;e.render(3,-1,...views[view],VIEW_SCALE,0,0);e.gl.readPixels(0,0,960,600,e.gl.RGBA,e.gl.UNSIGNED_BYTE,background);e.count=count;let colored=0,wrong=0,errors=0;const peaks=[],flux=[];for(const{a,b,c}of entries){e.weights.fill(0);e.weights[a]=1;e.fromWeights.set(e.weights);e.morphTarget=a;e.morphTime=1;e.render(3,b,...views[view],VIEW_SCALE,1.25*t,0);e.gl.finish();c.getContext('2d').drawImage(source,0,0,320,200);e.gl.readPixels(0,0,960,600,e.gl.RGBA,e.gl.UNSIGNED_BYTE,pixels);if(e.gl.getError())errors++;let energy=0;const values=[];for(let i=0;i<pixels.length;i+=32){const r=pixels[i]-background[i],g=pixels[i+1]-background[i+1],b=pixels[i+2]-background[i+2];energy+=Math.max(0,r);if(r>20){colored++;values.push(r);if(Math.abs(g/r-e.color[1]/e.color[0])>.12||Math.abs(b/r-e.color[2]/e.color[0])>.12)wrong++;}}values.sort((a,b)=>a-b);peaks.push(values[Math.floor(values.length*.95)]||0);flux.push(energy);}result.textContent=`进度 ${Math.round(t*100)}% · WebGL 错误 ${errors} · 色相异常 ${wrong}/${colored}`;return {peaks,flux,wrong,errors};}
angle.onclick=()=>{playing=false;view=(view+1)%4;angle.textContent='视角：'+['默认','侧视','俯视','翻转'][view];draw(current);};let purple=false;palette.onclick=()=>{purple=!purple;e.color.set(purple?[.64,.39,.94]:[.98,.88,.78]);e.targetColor.set(e.color);palette.textContent='配色：'+(purple?'紫':'金');draw(current);};
for(const b of document.querySelectorAll('[data-t]'))b.onclick=()=>{playing=false;draw(+b.dataset.t)};
scan.onclick=async()=>{playing=false;scan.disabled=true;const history=[];let bad=0,err=0;for(let n=0;n<=20;n++){const r=draw(n/20);history.push(r);bad+=r.wrong;err+=r.errors;await new Promise(requestAnimationFrame);}let step=0,dip=0;for(let j=0;j<entries.length;j++){const low=Math.min(history[0].peaks[j],history[20].peaks[j]);for(let n=1;n<=20;n++){step=Math.max(step,Math.abs(history[n].peaks[j]-history[n-1].peaks[j])/Math.max(1,history[n-1].peaks[j]));dip=Math.max(dip,(low-history[n].peaks[j])/Math.max(1,low));}}let fluxDip=0,fluxJump=0;for(let j=0;j<entries.length;j++){const low=Math.min(history[0].flux[j],history[20].flux[j]),hi=Math.max(history[0].flux[j],history[20].flux[j]);for(let n=1;n<=20;n++){fluxDip=Math.max(fluxDip,(low-history[n].flux[j])/low);fluxJump=Math.max(fluxJump,Math.abs(history[n].flux[j]-history[n-1].flux[j])/hi);}}result.dataset.report=JSON.stringify({step,dip,fluxDip,fluxJump,history});result.textContent=`光量中途下降 ${(fluxDip*100).toFixed(1)}% · 光量相邻步 ${(fluxJump*100).toFixed(1)}% · 21帧×12方向：亮点P95相邻帧最大变化 ${(step*100).toFixed(1)}% · 中途降亮 ${(dip*100).toFixed(1)}% · 色相异常 ${bad} · WebGL错误 ${err}`;scan.disabled=false;};
play.onclick=()=>{playing=!playing;start=performance.now();};
function tick(now){if(playing&&now-last>100){const phase=((now-start)/1800)%2;draw(phase<=1?phase:2-phase);last=now;}requestAnimationFrame(tick);}draw(.5);requestAnimationFrame(tick);
</script>
