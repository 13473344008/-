worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Same-origin gateway; do not forward permissive upstream CORS.
  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Avoid access logs with bearer tokens, captcha IDs or request bodies.
  log_format minimal '$remote_addr [$time_local] "$request_method $uri" $status';
  access_log /dev/stdout minimal;
  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
  limit_req_status 429;
  upstream passport_api { server backend:8000; }
  server {
    listen 8080;
    root /srv/admin;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control 'no-store' always;
    location = /healthz { access_log off; return 200 "admin-static-ready\n"; }
    location = /api/v1/login {
      limit_req zone=login burst=5 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://passport_api;
    }
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
      proxy_pass http://passport_api;
    }
    # Only content-hashed build assets are reusable across authenticated sessions.
    # HTML and all API responses retain no-store; missing assets must stay 404.
    location ~ "^/(?:js|css)/[^/]+\.[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
      try_files $uri =404;
      gzip_static on;
      gzip_vary on;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      add_header Cache-Control 'private, max-age=31536000, immutable';
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
